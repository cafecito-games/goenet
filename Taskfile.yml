version: '3'

vars:
  PKG: ./...

tasks:
  default:
    desc: Run the full CI pipeline locally.
    cmds:
      - task: ci

  build:
    desc: Build all packages.
    cmds:
      - go build ./...

  test:
    desc: Run unit tests.
    cmds:
      - go test -race -count=1 {{.PKG}}

  test:cover:
    desc: Run tests with coverage; writes to COVERAGE_FILE or a temp profile.
    cmds:
      - |
        coverage_file="${COVERAGE_FILE:-$(mktemp -t goenet-coverage.XXXXXX.out)}"
        go test -race -count=1 -coverprofile="$coverage_file" -covermode=atomic {{.PKG}}
        go tool cover -func="$coverage_file" | tail -1
        echo "coverage profile: $coverage_file"

  lint:
    desc: Run golangci-lint.
    cmds:
      - golangci-lint run

  fmt:
    desc: Format Go source.
    cmds:
      - go fmt {{.PKG}}
      - go run golang.org/x/tools/cmd/goimports@v0.44.0 -w .

  fmt:check:
    desc: Verify all Go files are formatted (CI use).
    cmds:
      - |
        tmp_gofmt=$(mktemp -t goenet-gofmt.XXXXXX.txt)
        tmp_goimports=$(mktemp -t goenet-goimports.XXXXXX.txt)
        trap 'rm -f "$tmp_gofmt" "$tmp_goimports"' EXIT
        gofmt -l . >"$tmp_gofmt"
        unformatted=$(grep -v '^vendor/' "$tmp_gofmt" || :)
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          echo "$unformatted"
          exit 1
        fi
        go run golang.org/x/tools/cmd/goimports@v0.44.0 -l . >"$tmp_goimports"
        unimported=$(grep -v '^vendor/' "$tmp_goimports" || :)
        if [ -n "$unimported" ]; then
          echo "Files needing goimports:"
          echo "$unimported"
          exit 1
        fi
    silent: true

  tidy:
    desc: Run go mod tidy.
    cmds:
      - go mod tidy

  tidy:check:
    desc: Verify go.mod/go.sum are tidy (CI use).
    cmds:
      - go mod tidy
      - |
        if ! git diff --quiet -- go.mod go.sum; then
          echo "go.mod/go.sum are not tidy. Run 'task tidy' and commit the result."
          git --no-pager diff -- go.mod go.sum
          exit 1
        fi
    silent: true

  ci:
    desc: Full CI pipeline (fmt:check + tidy:check + lint + test + build).
    cmds:
      - task: fmt:check
      - task: tidy:check
      - task: lint
      - task: test
      - task: build
